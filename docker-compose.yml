services:
  mysql:
    image: mysql:8.4
    container_name: taller-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: taller_mecanico
      MYSQL_USER: roci
      MYSQL_PASSWORD: 123456
    ports: ["3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
volumes:
  mysql_data:
